<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Стан водності великих річок України відносно норми 1997–2020 і ансамблевий прогноз стоку GloFAS."
    />
    <meta name="theme-color" content="#f5f5f7" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:title" content="Річки України — стан і прогноз стоку" />
    <meta
      property="og:description"
      content="Модельні витрати води GloFAS на великих річках України: відхилення від норми 1997–2020 і ансамблевий прогноз до 7 місяців."
    />
    <meta property="og:url" content="https://olede-dev.github.io/rivers-ua/" />
    <meta property="og:image" content="https://olede-dev.github.io/rivers-ua/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Річки України — стан і прогноз стоку</title>
    <script>
      // Applies the theme before first paint; src/composables/useTheme.ts takes over after mount.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
      // Sets the page language before first paint; src/composables/useLocale.ts takes over after mount.
      ;(function () {
        try {
          if (localStorage.getItem('lang') === 'en') document.documentElement.lang = 'en'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
